<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d6b62" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Египет" />
  <title>Египет · Путевой чек-лист</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div>
      <div class="eyebrow">29 августа — 5 сентября · 2 человека</div>
      <h1>Москва → Шарм-эль-Шейх</h1>
      <p>Reef Oasis Blue Bay · 7 ночей</p>
    </div>
    <button id="installBtn" class="ghost hidden">Установить</button>
  </header>

  <main>
    <section class="status-card" id="statusCard">
      <div>
        <div class="muted">Сейчас</div>
        <strong id="currentStageTitle">Подготовка к поездке</strong>
      </div>
      <div class="progress-wrap">
        <div class="progress-text"><span id="doneCount">0</span>/<span id="totalCount">0</span></div>
        <div class="progress"><span id="progressBar"></span></div>
      </div>
    </section>

    <nav class="tabs" aria-label="Разделы">
      <button class="tab active" data-tab="stages">Маршрут</button>
      <button class="tab" data-tab="packing">Вещи</button>
      <button class="tab" data-tab="info">Важно</button>
    </nav>

    <section id="stages" class="tab-panel active"></section>
    <section id="packing" class="tab-panel"></section>
    <section id="info" class="tab-panel"></section>
  </main>

  <footer>
    <button id="resetBtn" class="danger-link">Сбросить отметки</button>
    <div class="muted small">Все отметки хранятся только на этом устройстве.</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
